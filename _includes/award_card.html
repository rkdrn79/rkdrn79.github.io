{% assign award = include.award %}
<article class="entry-card entry-card-dated award-card">
  <div class="entry-date">{{ award.date }}</div>
  <div class="entry-body">
    <p class="entry-kicker">{{ award.organization }}</p>
    <h3 class="entry-title">{{ award.title }}</h3>
    <p>{{ award.description }}</p>
    {% if award.code or award.webpage %}
      <div class="paper-actions">
        {% if award.code %}
          <a class="action-btn" href="{{ award.code }}" target="_blank" rel="noopener noreferrer" title="Code" aria-label="Open award project code">
            <i class="fa-brands fa-github"></i>
          </a>
        {% endif %}
        {% if award.webpage %}
          <a class="action-btn" href="{{ award.webpage }}" target="_blank" rel="noopener noreferrer" title="Competition" aria-label="Open competition page">
            <i class="fa-solid fa-trophy"></i>
          </a>
        {% endif %}
      </div>
    {% endif %}
  </div>
</article>
